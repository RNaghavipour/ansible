# Path to deploy prometheus
prometheus_path: "/opt/monitoring/prometheus"

# Image name and tag of prometheus
prometheus_image: "prom/prometheus:v3.7.2"

# Name of the container
prometheus_container_name: "prometheus"

# Data save in local path instead of docker volume
prometheus_local_data: false

# Port number of the host that map to prometheus port
prometheus_port: 9090

# Enable remote_write feature or not
prometheus_remote_write: false
