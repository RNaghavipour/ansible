---
- name: Configure proxy for apt
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/80proxy
    mode: '0644'
    content: |
      Acquire::http::Proxy "http://{{ proxy_ip }}:{{ proxy_port }}";
      Acquire::https::Proxy "https://{{ proxy_ip }}:{{ proxy_port }}";
      Acquire::http::Proxy::localhost "DIRECT";
      Acquire::https::Proxy::localhost "DIRECT";
  when: proxy_scope.apt

- name: Remove proxy configs from apt
  ansible.builtin.file:
    path: /etc/apt/apt.conf.d/80proxy
    state: absent
  when: proxy_remove.apt
