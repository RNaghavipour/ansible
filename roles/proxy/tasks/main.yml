---
- name: Configure proxy system-wide
  ansible.builtin.blockinfile:
    path: /etc/environment
    marker: "# {mark} ANSIBLE PROXY"
    block: |
      http_proxy=http://{{ proxy_ip }}:{{ proxy_port }}
      https_proxy=http://{{ proxy_ip }}:{{ proxy_port }}
      HTTP_PROXY=http://{{ proxy_ip }}:{{ proxy_port }}
      HTTPS_PROXY=http://{{ proxy_ip }}:{{ proxy_port }}
      all_proxy=socks5://{{ proxy_ip }}:{{ proxy_port }}
      ALL_PROXY=socks5://{{ proxy_ip }}:{{ proxy_port }}
  when: proxy_scope.system_wide | default(false)

- name: Remove proxy system-wide
  ansible.builtin.blockinfile:
    path: /etc/environment
    marker: "# {mark} ANSIBLE PROXY"
    state: absent
  when: proxy_remove.system_wide | default(false)

- name: Configure proxy for shell sessions
  ansible.builtin.include_tasks:
    file: shell.yml

- name: Configure proxy for systemd services
  ansible.builtin.include_tasks:
    file: systemd_services_proxy.yml

- name: Configure proxy for wget
  ansible.builtin.include_tasks:
    file: wget_proxy.yml

- name: Configure proxy for apt
  ansible.builtin.include_tasks:
    file: apt_proxy.yml
  when: ansible_os_family == "Debian"

- name: Configure proxy for yum
  ansible.builtin.include_tasks:
    file: yum_proxy.yml
  when: ansible_os_family == "RedHat"
